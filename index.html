<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Roast & Co.</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:wght@500;600&display=swap"
    rel="stylesheet"
  />

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: #f1efee;
      font-family: "DM Sans", sans-serif;
      color: #66330f;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 30px;
    }

    /* =========================
       HERO
    ========================= */

    .hero {
      width: min(1180px, 100%);
      height: 700px;
      position: relative;
      overflow: hidden;

      background: #fcfbfb;
      border: 4px solid #ffffff;
      border-radius: 28px;

      box-shadow:
        0 4px 20px rgba(50, 30, 15, 0.04);
    }

    /* =========================
       NAVBAR
    ========================= */

    .navbar {
      height: 88px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 78px;

      position: relative;
      z-index: 10;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;

      font-family: "Playfair Display", serif;
      font-size: 24px;
      font-weight: 600;
      color: #6a350e;
    }

    .logo-icon {
      width: 25px;
      height: 25px;

      border-radius: 50%;
      border: 1.5px solid #8b572d;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 13px;
    }

    .nav-links {
      display: flex;
      align-items: center;
      gap: 38px;

      margin-left: 100px;
    }

    .nav-links a {
      text-decoration: none;
      color: #967b68;

      font-size: 12px;
      font-weight: 500;

      position: relative;
      transition: 0.25s ease;
    }

    .nav-links a:hover {
      color: #6a350e;
    }

    .nav-links a.active {
      color: #6a350e;
    }

    .nav-links a.active::after {
      content: "";
      position: absolute;

      left: 0;
      bottom: -7px;

      width: 100%;
      height: 1px;

      background: #7b431b;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .nav-icon {
      width: 18px;
      height: 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      color: #70401e;
      cursor: pointer;
    }

    .signin {
      border: none;
      background: #71390f;
      color: white;

      height: 38px;
      padding: 0 27px;

      border-radius: 22px;

      font-family: inherit;
      font-size: 11px;

      cursor: pointer;
      transition: 0.25s ease;
    }

    .signin:hover {
      transform: translateY(-2px);
      background: #592b0b;
    }

    /* =========================
       MAIN HERO CONTENT
    ========================= */

    .hero-content {
      position: relative;
      z-index: 5;

      height: calc(100% - 88px);

      display: grid;
      grid-template-columns: 48% 52%;
      align-items: center;

      padding: 0 55px 90px;
    }

    /* =========================
       LEFT VISUAL
    ========================= */

    .visual {
      position: relative;
      height: 430px;
    }

    .cup {
      position: absolute;

      width: 170px;
      height: 290px;

      border-radius: 12px 12px 42px 42px;

      background:
        linear-gradient(
          90deg,
          #f0efeb 0%,
          #ffffff 38%,
          #d7d4ce 100%
        );

      box-shadow:
        12px 18px 25px rgba(50, 25, 10, 0.13);

      transform: rotate(-12deg);
    }

    .cup.one {
      left: 45px;
      top: 90px;
    }

    .cup.two {
      width: 155px;
      height: 275px;

      left: 205px;
      top: 42px;

      transform: rotate(9deg);

      background:
        linear-gradient(
          90deg,
          #8b481b 0%,
          #b96929 45%,
          #754019 100%
        );
    }

    /* Cup lids */

    .lid {
      position: absolute;

      width: 182px;
      height: 39px;

      left: -6px;
      top: -19px;

      border-radius: 50%;

      background:
        linear-gradient(
          #382019,
          #160e0c
        );

      box-shadow:
        0 5px 4px rgba(0, 0, 0, 0.15);
    }

    .cup.two .lid {
      width: 165px;
      left: -5px;
      background:
        linear-gradient(
          #3c241b,
          #1d100c
        );
    }

    /* Cup sleeve */

    .sleeve {
      position: absolute;

      width: 100%;
      height: 104px;

      top: 91px;
      left: 0;

      background: #171514;

      display: flex;
      align-items: center;
      justify-content: center;
    }

    .cup.two .sleeve {
      background: #754019;
    }

    .coffee-logo {
      width: 82px;
      height: 82px;

      border-radius: 50%;

      border: 5px dotted #f18d22;
      outline: 2px solid #71390f;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: #e9d9c9;

      font-size: 10px;
      letter-spacing: 0.4px;
    }

    .coffee-logo strong {
      font-size: 11px;
      font-weight: 500;
    }

    .beans {
      margin-top: 5px;
      font-size: 16px;
    }

    /* Small coffee beans */

    .bean {
      position: absolute;

      width: 22px;
      height: 13px;

      border-radius: 50%;

      background: #75380f;

      transform: rotate(-30deg);

      box-shadow:
        inset -3px -2px 0 rgba(0, 0, 0, 0.15);
    }

    .bean::after {
      content: "";

      position: absolute;

      width: 2px;
      height: 9px;

      background: rgba(255, 210, 160, 0.5);

      left: 10px;
      top: 2px;

      transform: rotate(20deg);
    }

    .bean.b1 {
      left: 20px;
      top: 48px;
    }

    .bean.b2 {
      right: 35px;
      top: 20px;
      transform: rotate(30deg);
    }

    .bean.b3 {
      right: 20px;
      bottom: 78px;
      transform: rotate(-20deg);
    }

    .bean.b4 {
      left: 85px;
      bottom: 25px;
      transform: rotate(15deg);
    }

    /* Price badge */

    .price {
      position: absolute;

      left: 300px;
      top: 270px;

      width: 82px;
      height: 82px;

      border-radius: 50%;

      background: #ffb33d;

      border: 3px solid #e78c23;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      color: #66330f;

      box-shadow:
        0 5px 10px rgba(90, 40, 5, 0.12);

      transform: rotate(-3deg);
    }

    .price span {
      font-size: 9px;
    }

    .price strong {
      font-size: 18px;
      font-weight: 500;
    }

    /* =========================
       RIGHT SIDE
    ========================= */

    .copy {
      position: relative;
      z-index: 5;

      padding-left: 12px;

      margin-top: -35px;
    }

    .copy h1 {
      max-width: 550px;

      font-family: "Playfair Display", serif;

      font-size: clamp(48px, 5vw, 68px);
      line-height: 0.98;
      font-weight: 500;

      letter-spacing: -2.5px;

      color: #6b350e;

      margin-bottom: 25px;
    }

    .copy p {
      width: 430px;
      max-width: 100%;

      color: #a28773;

      font-size: 12px;
      line-height: 1.65;

      margin-bottom: 27px;
    }

    .order-btn {
      height: 45px;

      display: inline-flex;
      align-items: center;
      gap: 15px;

      border: none;
      border-radius: 25px;

      padding: 0 8px 0 20px;

      background: #70380e;
      color: white;

      font-family: inherit;
      font-size: 11px;

      cursor: pointer;
      transition: 0.25s ease;
    }

    .order-btn:hover {
      transform: translateY(-2px);
      background: #572a0a;
    }

    .order-arrow {
      width: 30px;
      height: 30px;

      border-radius: 50%;

      background: white;
      color: #70380e;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 17px;
    }

    /* =========================
       BOTTOM DECORATION
    ========================= */

    .bottom-shape {
      position: absolute;

      left: -3%;
      bottom: -1px;

      width: 106%;
      height: 190px;

      background: #f2eeee;

      border-radius: 55% 55% 0 0 / 35% 35% 0 0;

      transform: rotate(-1deg);

      z-index: 1;
    }

    .bottom-shape::before {
      content: "";

      position: absolute;

      left: 0;
      top: -38px;

      width: 55%;
      height: 100px;

      background: #f2eeee;

      border-radius: 50%;

      transform: rotate(-4deg);
    }

    /* =========================
       STATS
    ========================= */

    .stats {
      position: absolute;

      left: 55px;
      bottom: 55px;

      z-index: 8;

      display: flex;
      gap: 58px;
    }

    .stat {
      min-width: 80px;
    }

    .stat-number {
      font-family: "Playfair Display", serif;

      font-size: 31px;
      line-height: 1;

      color: #6a350e;
    }

    .stat-label {
      margin-top: 7px;

      color: #967b68;

      font-size: 10px;
    }

    /* =========================
       DECORATIVE BEANS
    ========================= */

    .floating-bean {
      position: absolute;

      width: 15px;
      height: 9px;

      border-radius: 50%;

      background: #6f330c;

      z-index: 7;
    }

    .fb1 {
      right: 360px;
      bottom: 145px;
      transform: rotate(40deg);
    }

    .fb2 {
      right: 315px;
      bottom: 117px;
      transform: rotate(-30deg);
    }

    .fb3 {
      right: 95px;
      bottom: 105px;
      transform: rotate(65deg);
    }

    .fb4 {
      right: 62px;
      bottom: 155px;
      transform: rotate(-30deg);
    }

    /* =========================
       COFFEE SPLASH
    ========================= */

    .splash {
      position: absolute;

      right: -25px;
      bottom: -35px;

      width: 360px;
      height: 145px;

      background: #78390f;

      border-radius: 55% 45% 0 0;

      transform: rotate(-5deg);

      z-index: 4;

      box-shadow:
        inset 0 12px 15px rgba(0, 0, 0, 0.08);
    }

    .splash::before {
      content: "";

      position: absolute;

      width: 85px;
      height: 130px;

      right: 55px;
      top: -80px;

      background: #78390f;

      border-radius: 80% 20% 70% 30%;

      transform: rotate(-28deg);
    }

    .splash::after {
      content: "";

      position: absolute;

      width: 30px;
      height: 30px;

      right: 30px;
      top: -62px;

      border-radius: 50%;

      background: #78390f;
    }

    /* =========================
       RESPONSIVE
    ========================= */

    @media (max-width: 900px) {

      body {
        padding: 15px;
      }

      .hero {
        height: auto;
        min-height: 720px;
      }

      .navbar {
        padding: 0 30px;
      }

      .nav-links {
        display: none;
      }

      .hero-content {
        grid-template-columns: 1fr;
        padding: 20px 35px 220px;
      }

      .visual {
        height: 330px;
        transform: scale(0.8);
        transform-origin: center;
      }

      .copy {
        margin-top: -10px;
        padding-left: 0;
        text-align: center;
      }

      .copy h1 {
        margin-left: auto;
        margin-right: auto;
      }

      .copy p {
        margin-left: auto;
        margin-right: auto;
      }

      .stats {
        left: 35px;
        bottom: 35px;
      }

      .bottom-shape {
        height: 180px;
      }
    }

    @media (max-width: 520px) {

      .hero {
        border-radius: 20px;
      }

      .navbar {
        height: 75px;
        padding: 0 20px;
      }

      .logo {
        font-size: 20px;
      }

      .nav-right .nav-icon {
        display: none;
      }

      .hero-content {
        padding-left: 20px;
        padding-right: 20px;
      }

      .visual {
        transform: scale(0.65);
        margin-left: -30px;
      }

      .copy h1 {
        font-size: 43px;
        letter-spacing: -1.5px;
      }

      .copy p {
        font-size: 11px;
      }

      .stats {
        gap: 25px;
        left: 22px;
      }

      .stat-number {
        font-size: 24px;
      }

      .stat-label {
        font-size: 9px;
      }

      .splash {
        opacity: 0.7;
      }
    }
  </style>
</head>

<body>

  <section class="hero">

    <!-- ================= NAVBAR ================= -->

    <nav class="navbar">

      <div class="logo">
        <div class="logo-icon">☕</div>
        Roast & Co.
      </div>

      <div class="nav-links">
        <a href="#" class="active">Home</a>
        <a href="#">Menu</a>
        <a href="#">Story</a>
        <a href="#">Reviews</a>
      </div>

      <div class="nav-right">

        <div class="nav-icon">
          <svg width="15" height="15" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="11" cy="11" r="6"></circle>
            <path d="m16 16 4 4"></path>
          </svg>
        </div>

        <div class="nav-icon">
          <svg width="16" height="16" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="1.7">
            <path d="M6 7h14l-1 10H7L6 7Z"></path>
            <path d="M6 7 5 4H2"></path>
            <circle cx="9" cy="20" r="1"></circle>
            <circle cx="18" cy="20" r="1"></circle>
          </svg>
        </div>

        <button class="signin">
          Sign in
        </button>

      </div>

    </nav>


    <!-- ================= MAIN CONTENT ================= -->

    <div class="hero-content">

      <!-- LEFT VISUAL -->

      <div class="visual">

        <!-- Cup 1 -->

        <div class="cup one">

          <div class="lid"></div>

          <div class="sleeve">

            <div class="coffee-logo">
              <strong>ROAST</strong>
              <span>&</span>
              <strong>COFFEE</strong>
              <div class="beans">☕</div>
            </div>

          </div>

        </div>


        <!-- Cup 2 -->

        <div class="cup two">

          <div class="lid"></div>

          <div class="sleeve">

            <div class="coffee-logo">
              <strong>SLOW</strong>
              <span>ROAST</span>
              <div class="beans">☕</div>
            </div>

          </div>

        </div>


        <!-- Beans -->

        <div class="bean b1"></div>
        <div class="bean b2"></div>
        <div class="bean b3"></div>
        <div class="bean b4"></div>


        <!-- Price -->

        <div class="price">
          <span>Starting at</span>
          <strong>$6.90</strong>
        </div>

      </div>


      <!-- RIGHT CONTENT -->

      <div class="copy">

        <h1>
          Make Your<br>
          Morning Better
        </h1>

        <p>
          Freshly roasted coffee made for slow mornings,
          deep conversations, and everything in between.
        </p>

        <button class="order-btn">
          Explore Menu

          <span class="order-arrow">
            ↗
          </span>
        </button>

      </div>

    </div>


    <!-- ================= BOTTOM ================= -->

    <div class="bottom-shape"></div>


    <div class="stats">

      <div class="stat">
        <div class="stat-number">2K+</div>
        <div class="stat-label">Happy Customers</div>
      </div>

      <div class="stat">
        <div class="stat-number">18+</div>
        <div class="stat-label">Coffee Blends</div>
      </div>

      <div class="stat">
        <div class="stat-number">12</div>
        <div class="stat-label">Years Roasting</div>
      </div>

    </div>


    <!-- Floating beans -->

    <div class="floating-bean fb1"></div>
    <div class="floating-bean fb2"></div>
    <div class="floating-bean fb3"></div>
    <div class="floating-bean fb4"></div>


    <!-- Coffee splash -->

    <div class="splash"></div>

  </section>

</body>
</html>
